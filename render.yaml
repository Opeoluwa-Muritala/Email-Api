services:
  - type: web
    name: email-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: MAIL_SERVICE_ID
        sync: false
      - key: MAIL_TEMPLATE_ID
        sync: false
      - key: MAIL_USER_ID
        sync: false
      - key: MAIL_PRIVATE_KEY
        sync: false
      - key: MAIL_EMAIL
        sync: false
